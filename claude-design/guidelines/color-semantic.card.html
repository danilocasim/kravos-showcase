<!-- @dsCard group="Colors" viewport="700x170" name="Semantic" subtitle="Success, warning, danger, info — surface + foreground pairs" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-card)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-overline);letter-spacing:var(--tracking-wide)}.legend{display:flex;gap:0;margin-top:6px}.legend>span{flex:1;font:var(--type-caption);color:var(--text-subtle);padding-left:6px}
.tiles{display:flex;gap:10px;flex-wrap:wrap}.tile{border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:10px 12px;min-width:118px}.tile b{display:block;font:var(--type-caption);color:var(--text-muted);font-weight:var(--weight-medium)}.tile i{display:block;font:var(--type-mono);font-size:var(--text-2xs);color:var(--text-subtle);font-style:normal;margin-top:2px}
</style></head><body><div class="tiles">
<div class="tile" style="background:var(--success-50);border-color:var(--spruce-200)"><b style="color:var(--success-700)">Success</b><span style="font:var(--type-body-strong);color:var(--success-700)">Confirmed</span><i>--success-50 / 700</i></div>
<div class="tile" style="background:var(--warning-50);border-color:var(--apricot-200)"><b style="color:var(--warning-700)">Warning</b><span style="font:var(--type-body-strong);color:var(--warning-700)">Cutoff passed</span><i>--warning-50 / 700</i></div>
<div class="tile" style="background:var(--danger-50);border-color:#f3cfcb"><b style="color:var(--danger-700)">Danger</b><span style="font:var(--type-body-strong);color:var(--danger-700)">Slot taken</span><i>--danger-50 / 700</i></div>
<div class="tile" style="background:var(--info-50);border-color:#cfe1ef"><b style="color:var(--info-700)">Info</b><span style="font:var(--type-body-strong);color:var(--info-700)">Policy note</span><i>--info-50 / 700</i></div>
</div></body></html>
