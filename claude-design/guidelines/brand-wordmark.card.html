<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-card)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-overline);letter-spacing:var(--tracking-wide)}.legend{display:flex;gap:0;margin-top:6px}.legend>span{flex:1;font:var(--type-caption);color:var(--text-subtle);padding-left:6px}
.tiles{display:flex;gap:10px;flex-wrap:wrap}.tile{border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:10px 12px;min-width:118px}.tile b{display:block;font:var(--type-caption);color:var(--text-muted);font-weight:var(--weight-medium)}.tile i{display:block;font:var(--type-mono);font-size:var(--text-2xs);color:var(--text-subtle);font-style:normal;margin-top:2px}
</style></head><body><div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
<span style="display:inline-flex;align-items:center;gap:10px"><span style="width:44px;height:44px;border-radius:var(--radius-md);background:var(--spruce-700);display:grid;place-items:center"><img src="../assets/icons/paw-print.svg" width="26" height="26" style="filter:brightness(0) invert(1)" alt=""></span><span style="font-family:var(--font-display);font-weight:700;font-size:var(--text-2xl);letter-spacing:var(--tracking-tight);color:var(--text-heading)">Paw &amp; Polish</span></span>
<span style="display:inline-flex;align-items:center;gap:10px;background:var(--spruce-900);padding:10px 16px;border-radius:var(--radius-md)"><span style="width:32px;height:32px;border-radius:var(--radius-sm);background:var(--apricot-400);display:grid;place-items:center"><img src="../assets/icons/paw-print.svg" width="19" height="19" alt=""></span><span style="font-family:var(--font-display);font-weight:700;font-size:var(--text-lg);color:var(--sand-50)">Paw &amp; Polish</span></span>
</div>
<div style="font:var(--type-caption);color:var(--text-subtle);margin-top:14px">Ampersand always "&amp;", never "and". Never set in the body face; never all-caps.</div></body></html>
