<!-- @dsCard group="Colors" viewport="700x150" name="Appointment status" subtitle="The four API status values and the slot states" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-card)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-overline);letter-spacing:var(--tracking-wide)}.legend{display:flex;gap:0;margin-top:6px}.legend>span{flex:1;font:var(--type-caption);color:var(--text-subtle);padding-left:6px}
.tiles{display:flex;gap:10px;flex-wrap:wrap}.tile{border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:10px 12px;min-width:118px}.tile b{display:block;font:var(--type-caption);color:var(--text-muted);font-weight:var(--weight-medium)}.tile i{display:block;font:var(--type-mono);font-size:var(--text-2xs);color:var(--text-subtle);font-style:normal;margin-top:2px}
</style></head><body><div class="tiles">
<div class="tile" style="background:var(--status-confirmed-bg);border:none"><b style="color:var(--status-confirmed-fg)">CONFIRMED</b><i style="color:var(--status-confirmed-fg)">--status-confirmed-*</i></div>
<div class="tile" style="background:var(--status-completed-bg);border:none"><b style="color:var(--status-completed-fg)">COMPLETED</b><i style="color:var(--status-completed-fg)">--status-completed-*</i></div>
<div class="tile" style="background:var(--status-cancelled-bg);border:none"><b style="color:var(--status-cancelled-fg)">CANCELLED</b><i style="color:var(--status-cancelled-fg)">--status-cancelled-*</i></div>
<div class="tile" style="background:var(--status-pending-bg);border:none"><b style="color:var(--status-pending-fg)">PENDING</b><i style="color:var(--status-pending-fg)">--status-pending-*</i></div>
</div>
<div class="tiles" style="margin-top:10px">
<div class="tile" style="text-align:center;border-color:var(--slot-free-border);font:var(--type-body-strong);color:var(--text-heading)">10:15 AM<i>free slot</i></div>
<div class="tile" style="text-align:center;background:var(--slot-selected-bg);border-color:var(--slot-selected-bg);font:var(--type-body-strong);color:#fff">10:15 AM<i style="color:var(--spruce-200)">selected</i></div>
<div class="tile" style="text-align:center;background:var(--surface-sunken);font:var(--type-body-strong);color:var(--slot-unavailable-fg);text-decoration:line-through">10:15 AM<i style="text-decoration:none">unavailable</i></div>
</div></body></html>
