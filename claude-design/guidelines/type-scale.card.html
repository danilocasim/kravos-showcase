<!-- @dsCard group="Type" viewport="700x170" name="Type scale" subtitle="11 → 56px; 15px is the UI default, 24px+ for slide/marketing headlines" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-card)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-overline);letter-spacing:var(--tracking-wide)}.legend{display:flex;gap:0;margin-top:6px}.legend>span{flex:1;font:var(--type-caption);color:var(--text-subtle);padding-left:6px}
.tiles{display:flex;gap:10px;flex-wrap:wrap}.tile{border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:10px 12px;min-width:118px}.tile b{display:block;font:var(--type-caption);color:var(--text-muted);font-weight:var(--weight-medium)}.tile i{display:block;font:var(--type-mono);font-size:var(--text-2xs);color:var(--text-subtle);font-style:normal;margin-top:2px}
</style></head><body><div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;color:var(--text-heading);font-family:var(--font-sans)">
<span style="font-size:var(--text-2xs)">11</span><span style="font-size:var(--text-xs)">12</span><span style="font-size:var(--text-sm)">13</span><span style="font-size:var(--text-base);font-weight:600">15</span><span style="font-size:var(--text-md)">16</span><span style="font-size:var(--text-lg)">18</span><span style="font-size:var(--text-xl)">22</span><span style="font-size:var(--text-2xl);font-family:var(--font-display)">28</span><span style="font-size:var(--text-3xl);font-family:var(--font-display)">34</span><span style="font-size:var(--text-4xl);font-family:var(--font-display)">44</span><span style="font-size:var(--text-5xl);font-family:var(--font-display)">56</span>
</div></body></html>
