<!-- @dsCard group="Type" viewport="700x210" name="UI &amp; body — Plus Jakarta Sans" subtitle="15px default body, 13px small, 12px caption, 11px overline" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--surface-card)}.sw{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font:var(--type-overline);letter-spacing:var(--tracking-wide)}.legend{display:flex;gap:0;margin-top:6px}.legend>span{flex:1;font:var(--type-caption);color:var(--text-subtle);padding-left:6px}
.tiles{display:flex;gap:10px;flex-wrap:wrap}.tile{border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:10px 12px;min-width:118px}.tile b{display:block;font:var(--type-caption);color:var(--text-muted);font-weight:var(--weight-medium)}.tile i{display:block;font:var(--type-mono);font-size:var(--text-2xs);color:var(--text-subtle);font-style:normal;margin-top:2px}
</style></head><body><div style="display:flex;flex-direction:column;gap:7px">
<div style="font:var(--type-h3);color:var(--text-heading)">Heading 3 · 22px semibold</div>
<div style="font:var(--type-body-strong);color:var(--text-heading)">Body strong · 15px semibold — Maya Chen, Wed 2 Sep</div>
<div style="font:var(--type-body);color:var(--text-body)">Body · 15px regular — Bath, drying, brush-out, and light tidy.</div>
<div style="font:var(--type-small);color:var(--text-muted)">Small · 13px — Free changes until 24 hours before your visit.</div>
<div style="font:var(--type-caption);color:var(--text-subtle)">Caption · 12px medium — includes a 15-minute cleanup buffer</div>
<div style="font:var(--type-overline);color:var(--text-subtle);text-transform:uppercase;letter-spacing:var(--tracking-caps)">Overline · 11px semibold</div>
</div></body></html>
